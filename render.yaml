services:
  - type: web
    name: dhvani
    runtime: node
    plan: free # slim q8 index (9.3MB) + q8 ONNX embedder fit the 512MB instance
    # --include=dev: Render sets NODE_ENV=production, which would strip tsx/typescript
    buildCommand: npm ci --include=dev && npx tsx scripts/prefetch_model.ts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RETRIEVE_STRATEGIES
        value: sentence
      - key: INDEX_DIR
        value: data/index-slim
      - key: HF_CACHE_DIR
        value: ./.hf-cache
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
