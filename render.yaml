services:
  - type: web
    name: dhvani
    runtime: node
    plan: free # slim q8 index (9.3MB) + q8 ONNX embedder fit the 512MB instance
    # --include=dev: Render sets NODE_ENV=production, which would strip tsx/typescript
    buildCommand: npm ci --include=dev && npx tsx scripts/prefetch_model.ts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RETRIEVE_STRATEGIES
        value: sentence
      - key: OFF_TOPIC_THRESHOLD
        value: "0.55" # MiniLM scale: on-topic ~0.64-0.83, off-topic ~0.38-0.51 (e5 default is 0.80)
      - key: EMBED_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: INDEX_DIR
        value: data/index-mini
      - key: HF_CACHE_DIR
        value: ./.hf-cache
      - key: KEEPWARM_INTERVAL_MS
        value: "20000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=300
